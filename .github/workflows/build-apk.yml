name: Build Android APK (32-bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev python3-pip \
            unzip zip autoconf libtool pkg-config \
            libncurses-dev cmake \
            libffi-dev libssl-dev automake gettext \
            libncursesw5-dev || true
          # 兼容旧系统：尝试安装已废弃的包
          sudo apt-get install -y libtinfo5 || true

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (32-bit armeabi-v7a)
        run: |
          export USE_BUILDozer=1
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordreview-armeabi-v7a-apk
          path: bin/*.apk
          retention-days: 30
