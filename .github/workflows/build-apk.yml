name: Build Android APK (32-bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-dev python3-pip \
            unzip zip autoconf libtool pkg-config \
            libncurses-dev cmake \
            libffi-dev libssl-dev automake gettext
          sudo apt-get install -y libtinfo5 || true

      - name: Install Python build tools
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer cython

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (32-bit armeabi-v7a)
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== Build log (last 100 lines) ==="
          tail -n 100 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordreview-armeabi-v7a-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
